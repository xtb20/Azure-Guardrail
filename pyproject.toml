[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-guardrail"
version = "0.1.0"
description = "Assess Azure Terraform plans before deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
azure-guardrail = "azure_guardrail.__main__:main"

[tool.setuptools.packages.find]
include = ["azure_guardrail*"]
